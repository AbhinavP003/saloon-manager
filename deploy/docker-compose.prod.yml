# Production stack for GCE single-VM beta (~$0 Always Free e2-micro).
# Pre-built images (recommended): set BACKEND_IMAGE + FRONTEND_IMAGE, then pull + up --no-build.
# Local build fallback: omit image vars and run with --build.

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-saloon_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=20
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-saloon_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  backend:
    image: ${BACKEND_IMAGE:-saloon-backend:local}
    build:
      context: ..
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS}
      PORT: "8080"
    command: ["/app/start-with-migrate.sh"]
    expose:
      - "8080"
    mem_limit: 384m

  frontend:
    image: ${FRONTEND_IMAGE:-saloon-frontend:local}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: always
    depends_on:
      - backend
    expose:
      - "3000"
    mem_limit: 384m

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
