name: Deploy to GCP Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-south1
  BACKEND_IMAGE: asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/saloon-repo/saloon-backend
  FRONTEND_IMAGE: asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/saloon-repo/saloon-frontend

jobs:
  # -------------------------------------------------------
  # Job 1: Run Tests
  # -------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          SECRET_KEY: "dummy_test_secret_key"
        run: uv run pytest tests/ -v

  # -------------------------------------------------------
  # Job 2: Build & Deploy Backend
  # -------------------------------------------------------
  deploy-backend:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build and push backend image
        run: |
          docker build -t "${{ env.BACKEND_IMAGE }}:${{ github.sha }}" -t "${{ env.BACKEND_IMAGE }}:latest" .
          docker push "${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
          docker push "${{ env.BACKEND_IMAGE }}:latest"

      - name: Deploy backend to Cloud Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          # Write env-vars-file safely (printf can mangle URLs with % or quotes).
          python3 <<'PY'
          import os
          import sys

          database_url = os.environ.get("DATABASE_URL", "").strip()
          secret_key = os.environ.get("SECRET_KEY", "").strip()
          frontend_url = os.environ.get("FRONTEND_URL", "").strip()

          if not database_url:
              sys.exit("DATABASE_URL is empty — check GitHub secrets")
          if not secret_key:
              sys.exit("SECRET_KEY is empty — check GitHub secrets")
          if not frontend_url:
              frontend_url = "http://localhost:3000"
              print(
                  "WARNING: FRONTEND_URL secret not set; "
                  "defaulting BACKEND_CORS_ORIGINS to http://localhost:3000. "
                  "Set FRONTEND_URL to your Cloud Run frontend URL for production CORS."
              )

          pairs = [
              ("DATABASE_URL", database_url),
              ("SECRET_KEY", secret_key),
              ("BACKEND_CORS_ORIGINS", frontend_url),
          ]
          with open("/tmp/env.yaml", "w", encoding="utf-8") as f:
              for name, value in pairs:
                  escaped = value.replace("'", "''")
                  f.write(f"{name}: '{escaped}'\n")
          PY
          gcloud run deploy saloon-backend \
            --image ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --env-vars-file /tmp/env.yaml \
            --add-cloudsql-instances ${{ secrets.CLOUD_SQL_CONNECTION }}

  # -------------------------------------------------------
  # Job 3: Build & Deploy Frontend
  # -------------------------------------------------------
  deploy-frontend:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${{ secrets.BACKEND_URL }}" \
            -t "${{ env.FRONTEND_IMAGE }}:${{ github.sha }}" \
            -t "${{ env.FRONTEND_IMAGE }}:latest" \
            ./frontend
          docker push "${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"
          docker push "${{ env.FRONTEND_IMAGE }}:latest"

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy saloon-frontend \
            --image ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated
