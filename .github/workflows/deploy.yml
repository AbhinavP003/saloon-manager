name: Deploy to GCP Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-south1
  BACKEND_IMAGE: asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/saloon-repo/saloon-backend
  FRONTEND_IMAGE: asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/saloon-repo/saloon-frontend

jobs:
  # -------------------------------------------------------
  # Job 1: Run Tests
  # -------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          SECRET_KEY: "dummy_test_secret_key"
        run: uv run pytest tests/ -v

  # -------------------------------------------------------
  # Job 2: Build & Deploy Backend
  # -------------------------------------------------------
  deploy-backend:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Validate deploy secrets
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          if [ -z "$FRONTEND_URL" ]; then
            echo "FRONTEND_URL secret is empty — set it to your Cloud Run frontend URL"
            exit 1
          fi

      - name: Build and push backend image
        run: |
          docker build -t "${{ env.BACKEND_IMAGE }}:${{ github.sha }}" -t "${{ env.BACKEND_IMAGE }}:latest" .
          docker push "${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
          docker push "${{ env.BACKEND_IMAGE }}:latest"

      - name: Smoke test backend container startup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          docker run -d --name smoke-backend \
            -e DATABASE_URL="$DATABASE_URL" \
            -e SECRET_KEY="$SECRET_KEY" \
            -e BACKEND_CORS_ORIGINS="http://localhost:3000" \
            -e PORT=8080 \
            -p 8080:8080 \
            "${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "Smoke test passed"
              docker logs smoke-backend
              docker rm -f smoke-backend
              exit 0
            fi
            sleep 2
          done
          echo "Smoke test failed — container logs:"
          docker logs smoke-backend
          docker rm -f smoke-backend
          exit 1

      - name: Deploy backend to Cloud Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          # Write env-vars-file safely (printf can mangle URLs with % or quotes).
          python3 <<'PY'
          import os
          import sys

          database_url = os.environ.get("DATABASE_URL", "").strip()
          secret_key = os.environ.get("SECRET_KEY", "").strip()
          frontend_url = os.environ.get("FRONTEND_URL", "").strip()

          if not database_url:
              sys.exit("DATABASE_URL is empty — check GitHub secrets")
          if not secret_key:
              sys.exit("SECRET_KEY is empty — check GitHub secrets")

          def normalize_db_url(url: str) -> str:
              if url.startswith("sqlite"):
                  return url
              if url.startswith("postgresql+asyncpg://"):
                  return url
              if url.startswith("postgres://"):
                  return "postgresql+asyncpg://" + url[len("postgres://") :]
              if url.startswith("postgresql://"):
                  return "postgresql+asyncpg://" + url[len("postgresql://") :]
              return url

          normalized_db_url = normalize_db_url(database_url)
          if not normalized_db_url.startswith("postgresql+asyncpg://"):
              sys.exit(
                  "DATABASE_URL must normalize to postgresql+asyncpg:// "
                  f"(got scheme: {normalized_db_url.split(':', 1)[0]})"
              )
          if "/cloudsql/" in database_url:
              sys.exit(
                  "DATABASE_URL uses Cloud SQL socket — set Neon URL instead "
                  "(see docs/DATABASE_NEON.md)"
              )

          if not frontend_url:
              sys.exit(
                  "FRONTEND_URL is empty — set GitHub secret to your Cloud Run frontend URL"
              )

          pairs = [
              ("DATABASE_URL", database_url),
              ("SECRET_KEY", secret_key),
              ("BACKEND_CORS_ORIGINS", frontend_url),
          ]
          with open("/tmp/env.yaml", "w", encoding="utf-8") as f:
              for name, value in pairs:
                  escaped = value.replace("'", "''")
                  f.write(f"{name}: '{escaped}'\n")
          PY
          gcloud run deploy saloon-backend \
            --image ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --service-account saloon-run-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --env-vars-file /tmp/env.yaml

      - name: Verify backend deployment
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          BACKEND_URL=$(gcloud run services describe saloon-backend --region ${{ env.REGION }} --format='value(status.url)')
          curl -sf "$BACKEND_URL/health" | grep -q '"status":"ok"'
          curl -sf -H "Origin: $FRONTEND_URL" "$BACKEND_URL/api/v1/users/stores/" -D /tmp/cors-headers -o /dev/null
          grep -qi "access-control-allow-origin: $FRONTEND_URL" /tmp/cors-headers
          echo "Backend verified at $BACKEND_URL"

  # -------------------------------------------------------
  # Job 3: Build & Deploy Frontend
  # -------------------------------------------------------
  deploy-frontend:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Validate deploy secrets
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL secret is empty — frontend will bake in localhost:8000"
            exit 1
          fi

      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${{ secrets.BACKEND_URL }}" \
            -t "${{ env.FRONTEND_IMAGE }}:${{ github.sha }}" \
            -t "${{ env.FRONTEND_IMAGE }}:latest" \
            ./frontend
          docker push "${{ env.FRONTEND_IMAGE }}:${{ github.sha }}"
          docker push "${{ env.FRONTEND_IMAGE }}:latest"

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy saloon-frontend \
            --image ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 3000

      - name: Verify frontend deployment
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          FRONTEND_URL=$(gcloud run services describe saloon-frontend --region ${{ env.REGION }} --format='value(status.url)')
          curl -sf "$FRONTEND_URL" -o /dev/null
          echo "Frontend verified at $FRONTEND_URL (API baked to $BACKEND_URL)"
