name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          SECRET_KEY: "dummy_test_secret_key"
        run: uv run pytest tests/ -v

# Production deploy: GCE single-VM (manual) — see docs/DEPLOY_GCE.md
#   .\deploy\gce-deploy.ps1
# Alternative: Neon + Cloud Run — see docs/DATABASE_NEON.md
